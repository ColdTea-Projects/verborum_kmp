<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verborum</title>
    <meta name="theme-color" content="#C41E3A">
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
<!--
  The pre-Compose loading state: what is on screen while the Wasm bundle downloads and starts.
  It cannot read the theme, so its colours are the palette's own literals.
-->
<div class="loading">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="currentColor" stroke-width="4" fill="none" opacity="0.2"/>
        <circle cx="25" cy="25" r="20" stroke="#C41E3A" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
</div>
<script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
